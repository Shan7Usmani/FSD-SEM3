<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table id="table">
        <h2>Student Registration Form</h2>
    <form id="myform">
        <tr>
            <td>
                <label for="name">Name: </label>
            </td>
            <td>
                <input type="text" placeholder="Enter Your Name"></input>
            </td>
        </tr>
        <tr>
            <td>
                <label for="email">Email: </label>
            </td>
            <td>
                <input type="email" placeholder="Enter Your Email"></input>
            </td>
        </tr>
        <tr>
            <td>
                <label for="dob">Date of Birth: </label>
            </td>
            <td>
                <input type="date" placeholder="Enter Your Date of Birth"></input>
            </td>
        </tr>
        <tr>
            <td>
                <label for="rollno">Roll Number: </label>
            </td>
            <td>
                <input type="number" placeholder="Enter Your Roll Number"></input>
            </td>
        </tr>
        <tr>
            <td>
                <label for="Phnumber">Phone Number: </label>
            </td>
            <td>
                <input type="tel" placeholder="Enter Your Phone Number"></input>
            </td>
        </tr>
        <tr>
            <td>
                <label for="Address">Address: </label>
            </td>
            <td>
                <input type="text-area" placeholder="Enter Your Address"></input>
            </td>
        </tr>
        <tr>
            <td>
                <label for="University Roll Number">University Roll Number: </label>
            </td>
            <td>
                <input type="text" placeholder="Enter Your University Roll Number"></input>
            </td>
        </tr>
        <tr>
            <td>
                <label for="Cgpa">CGPA: </label>
            </td>
            <td>
                <input type="double" placeholder="Enter Your CGPA"></input>
            </td>
        </tr>
        <tr>
            <td>
                <label for="Skills">Skills: </label>
            </td>
            <td>
                <textarea placeholder="Enter Your Skills"></textarea>
            </td>
        </tr>
         <tr>
            <td>
                <label for="Laptop">Laptop : </label>
            </td>
            <td>
                <textarea placeholder="Enter Your Laptop Details"></textarea>
            </td>
        </tr>
        <tr>
            <td>
                <label for="submission">Submission: </label>
            </td>
            <td>
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </td>
        </tr>
    </form>

    </table>
    
    <script src="script.js"></script>
</body>
</html>
